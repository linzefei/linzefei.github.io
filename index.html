<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy · linzefei</title>
    <meta name="description" content="linzefei 的个人词语星系：把想留住的词放进星系里，访客可以点亮它们。">
    <meta property="og:title" content="Galaxy · linzefei">
    <meta property="og:description" content="一个用星星组成的个人词语星系。词被点亮得越多，就越大越亮。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://linzefei.com/">
    <meta property="og:image" content="https://linzefei.com/og-image.jpg">
    <meta property="og:image:width" content="2192">
    <meta property="og:image:height" content="1152">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            cursor: crosshair;
        }
        canvas { display: block; }

        #logo {
            position: fixed;
            top: 22px; left: 24px;
            color: rgba(255,255,255,0.35);
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: lowercase;
            pointer-events: none;
            user-select: none;
        }

        #hint {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.38);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            user-select: none;
            transition: opacity 1s;
        }

        #stats {
            position: fixed;
            top: 22px; right: 22px;
            color: rgba(255,255,255,0.18);
            font-size: 11px;
            text-align: right;
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
        }

        #ignite-badge {
            position: fixed;
            bottom: 52px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity .5s, color .3s, text-shadow .3s;
        }
        #ignite-badge.lit { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }

        /* ── 偶遇旧词：左下角悄悄浮出的一颗旧星 ── */
        #encounter {
            position: fixed;
            left: 24px; bottom: 22px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.6s;
            user-select: none;
        }
        #encounter .enc-word { color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 2px; transition: color .3s; }
        #encounter .enc-date { color: rgba(255,255,255,0.25); font-size: 10px; letter-spacing: 1px; margin-top: 3px; }
        #encounter:hover .enc-word { color: rgba(255,215,0,0.85); }

        .ripple {
            position: fixed;
            border-radius: 50%;
            border: 1.5px solid rgba(140, 200, 255, 0.7);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 0.9s ease-out forwards;
        }
        @keyframes rippleAnim {
            0%   { transform: translate(-50%,-50%) scale(0);  opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1);  opacity: 0; width: 160px; height: 160px; }
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Postprocessing for Bloom effect -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>
    <div id="logo">linzefei <a href="/words.html" style="pointer-events:auto;font-size:11px;letter-spacing:2px;color:rgba(140,200,255,0.3);text-decoration:none;margin-left:14px;vertical-align:middle;" onmouseover="this.style.color='rgba(140,200,255,0.8)'" onmouseout="this.style.color='rgba(140,200,255,0.3)'">words →</a></div>
    <div id="hint">drag to explore &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click to ignite</div>
    <div id="stats">
        <div id="particle-count"></div>
        <div id="word-count"></div>
        <div id="site-version" style="margin-top:4px;opacity:0.6;font-size:10px;letter-spacing:1px;"></div>
    </div>
    <div id="ignite-badge"></div>
    <div id="encounter"><div class="enc-word"></div><div class="enc-date"></div></div>

    <script src="js/api-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/galaxy.js"></script>
    <script src="js/wordParticles.js"></script>
    <script src="js/ambientWords.js"></script>
    <script src="js/main.js"></script>

    <script>
    /* ─── 版本号 ─────────────────────────────────────────────────────────── */
    const SITE_VERSION = 'v0.9.7';
    const _verEl = document.getElementById('site-version');
    if (_verEl) _verEl.textContent = SITE_VERSION;

    /* ─── 游客 ID + 安全 Token ───────────────────────────────────────────── */
    let vid = localStorage.getItem('_vid');
    if (!vid) {
        vid = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('_vid', vid);
    }
    let tok = localStorage.getItem('_tok');
    if (!tok) {
        const arr = crypto.getRandomValues(new Uint8Array(24));
        tok = 't_' + Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('_tok', tok);
    }

    /* ─── 工具：SHA-256 哈希 ─────────────────────────────────────────────── */
    async function sha256hex(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* ─── 注册访客身份（首次或跨页面）─────────────────────────────────────── */
    async function ensureVisitorRegistered() {
        if (sessionStorage.getItem('_vis_reg')) return;
        try {
            const hash = await sha256hex(tok);
            // 检测国家（ip-api.com 免费，无需 key）
            let country = null, countryCode = null;
            try {
                const geo = await fetch('https://api.country.is/', { cache: 'force-cache' });
                if (geo.ok) {
                    const g = await geo.json();
                    countryCode = g.country || null;
                    if (countryCode) { try { country = new Intl.DisplayNames(['en'], { type: 'region' }).of(countryCode); } catch {} }
                }
            } catch {}
            await fetch(SB_URL + '/rest/v1/visitors', {
                method: 'POST',
                headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal,resolution=ignore-duplicates' },
                body: JSON.stringify({ id: vid, token_hash: hash, country, country_code: countryCode })
            });
            sessionStorage.setItem('_vis_reg', '1');
        } catch {}
    }

    /* ─── 访问统计 ───────────────────────────────────────────────────────── */
    (function() {
        fetch(SB_URL + '/rest/v1/page_visits', {
            method: 'POST',
            headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
            body: JSON.stringify({
                visitor_id: vid,
                date: new Date().toISOString().slice(0, 10),
                referrer: document.referrer || null,
                user_agent: navigator.userAgent,
                page: location.pathname
            })
        }).catch(() => {});
    })();

    /* ─── Click vibration + shooting star ───────────────────────────────── */
    document.addEventListener('click', function(e) {
        if (typeof galaxy !== 'undefined' && galaxy) {
            // 触发空间震动（所有粒子颤动）
            if (galaxy.triggerVibration) galaxy.triggerVibration();

            const n = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < n; i++) setTimeout(() => galaxy._spawnShootingStar(), i * 80);
        }
    });

    setTimeout(() => {
        const h = document.getElementById('hint');
        if (h) h.style.opacity = '0';
    }, 6000);

    /* ─── 本人历史词（localStorage，只读）（localStorage）────────────────────────────────── */
    const MY_WORDS_KEY = '_my_words';
    const MY_TIMES_KEY = '_my_times';
    function getMyWords() {
        try { return JSON.parse(localStorage.getItem(MY_WORDS_KEY) || '[]'); } catch { return []; }
    }

    /* ─── 粒子文字队列系统 ───────────────────────────────────────────────── */
    let wordQueue   = [];   // 待显示单词列表
    let activeWord  = null; // 当前 WordParticles 实例
    let queueIndex  = 0;
    let wordScene   = null;
    let wordCamera  = null;
    let ambient     = null; // 背景沉浮的词（AmbientWords）
    const QUEUE_IDX_KEY = '_wq_idx';

    // 内置默认词（兜底：数据库未配置时使用）
    const DEFAULT_WORDS = [
        'Hello World!', 'Three.js', 'JavaScript', 'Python',
        'Java', 'C++', 'React', 'Vue', 'Angular', 'Node.js',
        'linzefei', 'Cursor', '2025'
    ];

    function updateWordCount() {
        const el = document.getElementById('word-count');
        if (el) el.textContent = wordQueue.length + ' words';
    }

    /* ─── 点亮档位：0=未点亮 1=1-2次 2=3-9次 3=10次以上（封顶） ─── */
    function igniteTier(count) {
        if (count >= 10) return 3;
        if (count >= 3)  return 2;
        if (count >= 1)  return 1;
        return 0;
    }

    async function fetchWords() {
        let dbEntries = [];
        try {
            const res = await fetch(
                SB_URL + '/rest/v1/visitor_words?select=id,word,sort_order,ignite_count,created_at&approved=eq.true&order=sort_order.asc,created_at.asc&limit=300',
                { headers: SB_HDR }
            );
            if (res.ok) {
                const rows = await res.json();
                dbEntries = rows.map(r => ({ word: r.word, id: r.id, ignite_count: r.ignite_count || 0, created_at: r.created_at }));
            }
        } catch {}

        if (!dbEntries.length) {
            dbEntries = DEFAULT_WORDS.map(w => ({ word: w, id: null, ignite_count: 0 }));
        }

        // 本人在本机提交过的词优先排在前面（按词文本匹配数据库条目）
        const myWords = getMyWords();
        const front = [], rest = [...dbEntries];
        myWords.forEach(w => {
            const i = rest.findIndex(e => e.word === w);
            if (i >= 0) front.push(rest.splice(i, 1)[0]);
            else front.unshift({ word: w, id: null, ignite_count: 0 });
        });
        wordQueue = [...front, ...rest];
        // 恢复上次播放序号，防止越界
        const savedIdx = parseInt(localStorage.getItem(QUEUE_IDX_KEY) || '0', 10);
        queueIndex = wordQueue.length > 0 ? (isNaN(savedIdx) ? 0 : savedIdx % wordQueue.length) : 0;
        updateWordCount();
    }

    let activeEntry = null; // 当前正在展示的词条目

    function tickWordQueue() {
        if (ambient) ambient.update();
        if (!wordScene || !wordCamera || wordQueue.length === 0) return;

        // 推进当前词
        if (activeWord) {
            activeWord.update();
            if (!activeWord.isDone()) return;
            activeWord = null;
            activeEntry = null;
            updateIgniteBadge();
            queueIndex = (queueIndex + 1) % wordQueue.length;
            localStorage.setItem(QUEUE_IDX_KEY, queueIndex.toString());
        }

        // 启动下一个词：借银河的星星成字，点亮档位决定词的大小
        const entry = wordQueue[queueIndex];
        if (entry) {
            activeEntry = entry;
            // 主词只借盘面前 3000 颗星（单词最多用 2600 颗），其余盘面留给背景沉浮的词，两边不抢星
            activeWord = new WordParticles(entry.word, galaxy, wordCamera, igniteTier(entry.ignite_count), 3000);
            if (ambient) ambient.setMainWord(entry.word);
            updateIgniteBadge();
        }
    }

    /* ─── 点亮（只在首页操作）：轻点当前词 点亮/取消点亮 ─────────────────── */
    const IGNITED_KEY = '_ignited';
    let igniteBusy = false;
    function getIgnitedSet() {
        try { return new Set(JSON.parse(localStorage.getItem(IGNITED_KEY) || '[]')); } catch { return new Set(); }
    }
    function saveIgnitedSet(set) {
        try { localStorage.setItem(IGNITED_KEY, JSON.stringify([...set])); } catch {}
    }
    function updateIgniteBadge() {
        const el = document.getElementById('ignite-badge');
        if (!el) return;
        if (!activeEntry || !activeEntry.id) { el.style.opacity = '0'; return; }
        const count = activeEntry.ignite_count || 0;
        const lit = getIgnitedSet().has(activeEntry.id);
        el.textContent = '✦ ' + count;
        el.className = lit ? 'lit' : '';
        el.style.opacity = '1';
    }
    async function toggleIgniteCurrent() {
        if (igniteBusy || !activeEntry || !activeEntry.id || !activeWord) return;
        igniteBusy = true;
        try {
            await ensureVisitorRegistered();
            const res = await fetch(SB_URL + '/rest/v1/rpc/toggle_ignite_v2', {
                method: 'POST',
                headers: { ...SB_HDR, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_word_id: activeEntry.id, p_visitor_id: vid, p_token: tok })
            });
            if (!res.ok) return;
            const out = await res.json();
            if (!out || out.error) return;
            activeEntry.ignite_count = out.ignite_count;
            const set = getIgnitedSet();
            if (out.ignited) set.add(activeEntry.id); else set.delete(activeEntry.id);
            saveIgnitedSet(set);
            if (activeWord) { activeWord.setTier(igniteTier(out.ignite_count)); activeWord.igniteFlash(); activeWord.extendHold(240); }
            updateIgniteBadge();
        } catch {} finally { igniteBusy = false; }
    }

    /* ─── 偶遇旧词：打开首页时，左下角浮出一颗以前的星 ─────────────────── */
    function setupEncounter() {
        const el = document.getElementById('encounter');
        if (!el) return;
        const pool = wordQueue.map((e, i) => ({ e, i })).filter(x => x.e.created_at);
        if (pool.length < 3) return;
        let pick = pool[Math.floor(Math.random() * pool.length)];
        let guard = 0;
        while (pick.i === queueIndex && guard++ < 8) pick = pool[Math.floor(Math.random() * pool.length)];
        el.querySelector('.enc-word').textContent = pick.e.word;
        el.querySelector('.enc-date').textContent =
            new Date(pick.e.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        el.title = 'see it in the galaxy';
        el.onclick = () => jumpToWord(pick.i);
        setTimeout(() => { el.style.opacity = '1'; }, 5000);
    }
    function jumpToWord(idx) {
        if (!wordQueue.length || (idx === queueIndex && activeWord)) return;
        if (activeWord) {
            // 让当前词立即散场，队列指针落到目标词上
            queueIndex = (idx - 1 + wordQueue.length) % wordQueue.length;
            activeWord.rushDisperse();
        } else {
            queueIndex = idx;
        }
    }

    // 轻点（区别于拖动旋转）才触发点亮；点链接不触发
    let _pDown = null;
    document.addEventListener('pointerdown', e => { _pDown = { x: e.clientX, y: e.clientY, t: Date.now() }; });
    document.addEventListener('pointerup', e => {
        if (!_pDown) return;
        const dx = e.clientX - _pDown.x, dy = e.clientY - _pDown.y;
        const dt = Date.now() - _pDown.t;
        _pDown = null;
        if (dx * dx + dy * dy > 64 || dt > 500) return;
        if (e.target && e.target.closest && (e.target.closest('a') || e.target.closest('#encounter'))) return;
        toggleIgniteCurrent();
    });

    /* ─── 等待 main.js 完成初始化后接入 ─────────────────────────────────── */
    window.addEventListener('load', () => {
        // 注册访客（后台静默，不阻塞渲染）
        ensureVisitorRegistered();

        requestAnimationFrame(() => {
            wordScene  = scene;   // 来自 main.js 全局变量
            wordCamera = camera;
            fetchWords().then(() => {
                setupEncounter();
                ambient = new AmbientWords(galaxy, wordCamera);
                ambient.setPool(wordQueue, null);
                // 延迟 1s 再开始，让银河先渲染出来
                setTimeout(() => {
                    tickWordQueue();
                }, 1000);
            });
        });
    });

    /* ─── 把 tickWordQueue 挂入渲染循环 ─────────────────────────────────── */
    // main.js 的 animate() 每帧调用 galaxy.update()，我们在此基础上追加
    window._wordTick = tickWordQueue;
    </script>
</body>
</html>
